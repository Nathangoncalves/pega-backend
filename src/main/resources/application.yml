server:
  port: ${PORT:8080}

spring:
  application:
    name: pega-backend

  # ===== PostgreSQL (Neon — sempre requer SSL) =====
  datasource:
    # sslmode=require fixo — Neon sempre exige SSL
    url: jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE:pega_db}?sslmode=require&sslrootcert=system
    username: ${PGUSER:${DB_USERNAME:pega_user}}
    password: ${PGPASSWORD:${DB_PASSWORD:pega_pass}}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  # ===== JPA / Hibernate =====
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  # ===== Jackson =====
  jackson:
    serialization:
      write-dates-as-timestamps: false

# ===== JADE + JWT =====
pega:
  jade:
    host: ${JADE_HOST:localhost}
    port: ${JADE_PORT:1099}
  jwt:
    secret: ${JWT_SECRET:pega-tcc-secret-key-2024-muito-segura-256bits-ok!}
    expiration-ms: 86400000

# ===== Swagger UI =====
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
  api-docs:
    path: /v3/api-docs

# ===== Logging =====
logging:
  level:
    br.tcc.pega: INFO
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
