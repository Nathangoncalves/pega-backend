server:
  port: ${PORT:8080}   # Railway injeta $PORT automaticamente

spring:
  application:
    name: pega-backend

  # ===== PostgreSQL =====
  # Railway injeta PGHOST, PGPORT, PGDATABASE, PGUSER, PGPASSWORD automaticamente
  datasource:
    url: jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE:pega_db}
    username: ${PGUSER:${DB_USERNAME:pega_user}}
    password: ${PGPASSWORD:${DB_PASSWORD:pega_pass}}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5      # reduzido para o plano gratuito
      minimum-idle: 1
      connection-timeout: 20000

  # ===== JPA / Hibernate =====
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  # ===== Jackson (datas como ISO-8601) =====
  jackson:
    serialization:
      write-dates-as-timestamps: false

# ===== JWT =====
pega:
  jade:
    host: ${JADE_HOST:localhost}
    port: ${JADE_PORT:1099}

  jwt:
    secret: ${JWT_SECRET:pega-tcc-secret-key-2024-muito-segura-256bits-ok!}
    expiration-ms: 86400000   # 24 horas

# ===== Swagger UI =====
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    tags-sorter: alpha
  api-docs:
    path: /v3/api-docs

# ===== Logging =====
logging:
  level:
    br.tcc.pega: INFO
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
